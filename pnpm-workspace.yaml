packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security advisories in transitive dependencies that no direct bump reaches.
# Each entry is the lowest version carrying the fix. Re-check with
# `pnpm audit:deps` and drop entries once a dependency ships the fix on its own.
# brace-expansion 1.x now has backports (1.1.17, 1.1.18), so the audit is
# expected to come back clean with no accepted exceptions.
overrides:
  'baseline-browser-mapping': ^2.11.0
  'brace-expansion@1': ^1.1.18
  'brace-expansion@5': ^5.0.9
  'browserslist': ^4.28.7
  'colord': ^2.9.4
  'esbuild': ^0.28.1
  'fast-uri': ^3.1.6
  'js-yaml@3': ^3.15.2
  'js-yaml@4': ^4.3.2
  'minimatch@3': ^3.1.4
  'nanoid@3': ^3.3.18
  'postcss': ^8.5.18
  'postcss-selector-parser@7': ^7.1.6
  'sharp': ^0.35.5
  'shell-quote': ^1.11.0
  'source-map-js': ^1.2.2
  'undici': ^7.29.1
  'ws': ^8.21.0
